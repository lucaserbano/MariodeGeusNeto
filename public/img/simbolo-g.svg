<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 175 787 649" class="simbolo-letra simbolo-letra--g" data-duracao="2" aria-hidden="true">
  <style>
    .simbolo-letra--g .tracado path {
      fill: none; stroke: #fff; stroke-width: 110;
      stroke-linecap: round; stroke-linejoin: round;
      /* pathLength=1 normaliza o comprimento: o dash vai de 1 (oculto) a 0
         (completo). O vão de 1,5 e o recuo de 1,01 tiram o traço inteiro de
         cima do caminho antes de começar: com `1 1` e recuo de exatamente 1,
         o dash termina em cima do ponto 0 e a ponta redonda de 110 acendia um
         disco ali — eram esses os pedaços da letra que apareciam antes da
         animação, um por traço. */
      stroke-dasharray: 1 1.5; stroke-dashoffset: 1.01;
    }
    @keyframes escrever-g { to { stroke-dashoffset: 0; } }
    .simbolo-letra--g.escrevendo .t1 { animation: escrever-g 2s ease-in-out 0s forwards; }
    /* Sem animação: a letra já aparece inteira. */
    @media (prefers-reduced-motion: reduce) {
      .simbolo-letra .tracado path { stroke-dashoffset: 0; animation: none !important; }
    }
  </style>
  <defs>
    <mask id="tracado-g" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <g class="tracado">
      <!-- Um traço só, sem emenda: começa na ponta de cima do G, desce em
           sentido anti-horário pela esquerda, dá a volta por baixo, sobe pela
           haste da direita e termina na ponta da perninha, no miolo da letra.
           Tem de ser um único subpath — `stroke-dasharray` reinicia a cada
           `M`, e era a emenda entre os quatro traços que pedia os atrasos
           encadeados de antes. -->
      <path class="t1" pathLength="1" d="M 650 250 A 286 286 0 1 0 676 783 L 686 358 L 548 512"/>
      </g>
    </mask>
  </defs>
