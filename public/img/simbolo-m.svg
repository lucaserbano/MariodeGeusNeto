<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 175 787 649" class="simbolo-letra simbolo-letra--m" data-duracao="2.3" aria-hidden="true">
  <style>
    .simbolo-letra--m .tracado path {
      fill: none; stroke: #fff; stroke-width: 150;
      stroke-linecap: round; stroke-linejoin: round;
      /* pathLength=1 normaliza o comprimento: o dash vai de 1 (oculto) a 0 (completo) */
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
    }
    @keyframes escrever-m { to { stroke-dashoffset: 0; } }
    .simbolo-letra--m.escrevendo .t1 { animation: escrever-m 2.3s ease-in-out 0s forwards; }
    /* Sem animação: a letra já aparece inteira. */
    @media (prefers-reduced-motion: reduce) {
      .simbolo-letra .tracado path { stroke-dashoffset: 0; animation: none !important; }
    }
  </style>
